<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Il Blog del Caffè — sito ospite di prova</title>
    <style>
      body { font: 16px/1.6 Georgia, serif; max-width: 42rem; margin: 0 auto; padding: 3rem 1rem; color: #222; }
      h1 { font-size: 2rem; }
      /* Stile aggressivo apposta: serve a dimostrare che non entra dentro il widget. */
      button { background: red !important; color: yellow !important; font-size: 30px !important; border-radius: 0 !important; }
    </style>
  </head>
  <body>
    <h1>Il Blog del Caffè</h1>
    <p>Sito finto che serve solo a ospitare il widget dell'assistente, su un'origine diversa dall'app.</p>
    <button type="button">Un bottone del sito ospite</button>
    <script>
      // L'indirizzo dell'app arriva da ?app=... così la stessa pagina prova locale e produzione.
      var app = new URLSearchParams(location.search).get("app") || "https://chatbot-clinica.giuseppebosi.com";
      var s = document.createElement("script");
      s.src = app + "/widget.js";
      s.defer = true;
      s.dataset.etichetta = "Prenota o chiedi";
      s.dataset.colore = "#0f3d4e";
      document.body.appendChild(s);
    </script>
  </body>
</html>
