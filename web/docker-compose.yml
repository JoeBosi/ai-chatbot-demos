# Production on the VPS: Caddy (host) -> 127.0.0.1:3040 -> app. Postgres is never published.
name: chat-bot

services:
  app:
    build: .
    image: chat-bot-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3040:3000"
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://chatbot:${POSTGRES_PASSWORD}@db:5432/chatbot
      # Free router: 1000 model requests/day and each chat turn uses 2-6 of them.
      CHAT_DAILY_LIMIT: "300"
      # Modello principale gratuito e stabile; se è occupato si passa alle riserve, poi al router gratuito.
      AI_MODEL: "nvidia/nemotron-3-ultra-550b-a55b:free"
      AI_FALLBACK_MODELS: "poolside/laguna-s-2.1:free,openrouter/free"
      # Public on purpose: it is printed in /tutorial and reaches every browser. It keeps crawlers
      # and stray scripts off /api/chat and /api/cart, and can be changed if someone abuses it.
      WIDGET_PUBLIC_KEY: "cfdemo_pub_2026"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1536m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_DB: chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]

  # Manutenzione, mai in esecuzione da sola (profilo "tools"): serve a lanciare i comandi del
  # progetto contro il database, che non e' raggiungibile da fuori. Monta il sorgente in sola
  # lettura e non tiene in piedi niente.
  #   docker compose --env-file .env.production --profile tools run --rm tools scripts/content.ts --dry-run
  tools:
    profiles: ["tools"]
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      DATABASE_URL: postgres://chatbot:${POSTGRES_PASSWORD}@db:5432/chatbot
      NODE_ENV: production
    # --conditions=react-server: fuori da Next, "server-only" va detto a mano a Node.
    entrypoint: ["npx", "tsx", "--conditions=react-server"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
